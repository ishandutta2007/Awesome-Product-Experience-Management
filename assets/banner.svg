<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#161c30" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#e879f9;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#e879f9;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#e879f9;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-dasharray: 4 4; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="16" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <!-- Animated Glowing Background Blobs -->
  <circle cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="200;250;180;200" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;140;80;100" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="300" r="220" fill="#a855f7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="1000;950;1030;1000" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="300;260;320;300" dur="11s" repeatCount="indefinite" />
  </circle>

  <!-- Grid Elements -->
  <g class="grid-line">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="720" y1="0" x2="720" y2="400" />
    <line x1="960" y1="0" x2="960" y2="400" />
  </g>

  <!-- Central Hub: PXM Single Source of Truth -->
  <g transform="translate(600, 290)">
    <!-- Orbit Rings -->
    <ellipse cx="0" cy="0" rx="380" ry="60" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
    </ellipse>

    <!-- Animated Flow Particles -->
    <circle r="4" fill="#38bdf8" filter="url(#softGlow)">
      <animateMotion path="M -300,-15 C -150,-45 150,-45 300,-15 C 150,45 -150,45 -300,-15" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#e879f9" filter="url(#softGlow)">
      <animateMotion path="M 300,-15 C 150,45 -150,45 -300,-15 C -150,-45 150,-45 300,-15" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#34d399" filter="url(#softGlow)">
      <animateMotion path="M -200,20 C -50,60 50,60 200,20 C 50,-60 -50,-60 -200,20" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Header Category Badges -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <!-- Badge 1: PIM -->
    <rect x="-270" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="-210" y="19" class="badge-text" fill="#38bdf8">📦 PIM</text>

    <!-- Badge 2: PXM -->
    <rect x="-135" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <text x="-75" y="19" class="badge-text" fill="#818cf8">✨ PXM</text>

    <!-- Badge 3: DAM -->
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <text x="60" y="19" class="badge-text" fill="#c084fc">🖼️ DAM</text>

    <!-- Badge 4: Syndication -->
    <rect x="135" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <text x="205" y="19" class="badge-text" fill="#34d399">🚀 Syndication</text>
  </g>

  <!-- Main Hero Title & Tagline -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <text class="title" y="0" filter="url(#softGlow)">Product Experience Management</text>
    <text class="subtitle" y="42">Curated SaaS Platforms &amp; Open-Source Ecosystem for Product Data</text>
  </g>

  <!-- Interactive Nodes Array -->
  <!-- Node Left: Ingest / Catalog Data -->
  <g transform="translate(180, 285)">
    <rect x="-90" y="-30" width="180" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="-6" text-anchor="middle" class="node-text" fill="#38bdf8" font-size="14" font-weight="700">📥 Data Ingestion</text>
    <text x="0" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">ERP • PLM • Suppliers</text>
  </g>

  <!-- Node Center: Enrichment & Governance -->
  <g transform="translate(600, 285)">
    <rect x="-120" y="-34" width="240" height="68" rx="14" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="-8" text-anchor="middle" class="node-text" fill="#e0e7ff" font-size="15" font-weight="800">⚡ PXM / PIM Core</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#c084fc">Enrichment • Governance • DAM</text>
  </g>

  <!-- Node Right: Omnichannel Syndication -->
  <g transform="translate(1020, 285)">
    <rect x="-90" y="-30" width="180" height="60" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="-6" text-anchor="middle" class="node-text" fill="#34d399" font-size="14" font-weight="700">🌐 Omnichannel</text>
    <text x="0" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Amazon • Shopify • Retail</text>
  </g>

  <!-- Connecting Arrows / Flow lines -->
  <path d="M 270 285 L 480 285" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.5s" repeatCount="indefinite" />
  </path>
  <polygon points="480,281 490,285 480,289" fill="#38bdf8" />

  <path d="M 720 285 L 930 285" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 5" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.5s" repeatCount="indefinite" />
  </path>
  <polygon points="930,281 940,285 930,289" fill="#a855f7" />

  <!-- Footer Tagline -->
  <g transform="translate(600, 368)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1.5">
      SINGLE SOURCE OF TRUTH • DIGITAL SHELF ANALYTICS • PRODUCT CONTENT SYNDICATION
    </text>
  </g>
</svg>
